name: doctor
description: AI Medical Voice Agent App with free services
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Firebase (FREE tier only)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.8
  
  # AI & Speech
  google_generative_ai: ^0.4.6
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1
  
  # Audio Recording
  record: ^5.1.2
  path_provider: ^2.1.5
  
  # Environment Variables
  flutter_dotenv: ^5.2.1
  
  # HTTP
  http: ^1.2.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  
  # Payment
  razorpay_flutter: ^1.3.7
  
  # File & Image Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  mime: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
